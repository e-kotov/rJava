name: Review - Windows MSVC runtime precedence
on:
  push:
    branches: [claude/upbeat-edison-pdd0gd]
  workflow_dispatch:
jobs:
  msvc:
    name: Windows MSVC precedence (R ${{ matrix.r }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        r: [release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          rtools-version: '45'
      - name: Download older Temurin releases (pinned tags)
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'oldjdk'; New-Item -ItemType Directory -Force $root | Out-Null
          $map = [ordered]@{}
          foreach ($tag in 'jdk8u392-b08', 'jdk-11.0.21+9', 'jdk-17.0.9+9', 'jdk-21.0.1+12') {
            $zip = Join-Path $root "$($tag -replace '\+','_').zip"
            Invoke-WebRequest "https://api.adoptium.net/v3/binary/version/$([uri]::EscapeDataString($tag))/windows/x64/jdk/hotspot/normal/eclipse" -OutFile $zip
            $dest = Join-Path $root ($tag -replace '\+','_'); Expand-Archive $zip $dest
            $home_ = (Get-ChildItem $dest -Directory | Select-Object -First 1).FullName
            $map["temurin-$tag"] = $home_ -replace '\\','/'
          }
          "REVIEW_JDKS=$($map | ConvertTo-Json -Compress)" | Out-File -Append $env:GITHUB_ENV
      - { uses: actions/setup-java@v5, id: t17, with: { distribution: temurin, java-version: '17' } }
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build master, exact candidate and review variant
        shell: bash
        run: bash review/build.sh
      - name: Build MSVC std::mutex probe
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'review/native'
          cl 2>&1 | Select-Object -First 1
          cl /nologo /LD /MD /EHsc /O2 review/mutex.cpp /Fe:"$out/mutex.dll" /Fo:"$out/"
          if ($LASTEXITCODE) { throw 'cl failed' }
          dumpbin /dependents "$out/mutex.dll" | Select-String -Pattern '\.dll'
      - name: Compare runtime origins and std::mutex probe
        shell: pwsh
        env:
          REVIEW_SKIP_MISSING: '1'
        run: |
          $env:R_HOME_DIR = (Rscript --vanilla -e 'cat(R.home())')
          $env:REVIEW_JDKS = $env:REVIEW_JDKS -replace '\\', '/'
          ./review/run.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-msvc-${{ matrix.r }}
          path: |
            ${{ runner.temp }}/review/logs
            ${{ runner.temp }}/review/results.csv
