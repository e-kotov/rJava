name: Review - Windows MSVC runtime precedence
on:
  push:
    branches: [claude/upbeat-edison-pdd0gd]
  workflow_dispatch:
jobs:
  msvc:
    name: Windows MSVC precedence (R ${{ matrix.r }})
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        r: [release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          rtools-version: '45'
      - { uses: actions/setup-java@v5, id: o8,  with: { distribution: temurin, java-version: '8.0.392+8' } }
      - { uses: actions/setup-java@v5, id: o11, with: { distribution: temurin, java-version: '11.0.21+9' } }
      - { uses: actions/setup-java@v5, id: o17, with: { distribution: temurin, java-version: '17.0.9+9' } }
      - { uses: actions/setup-java@v5, id: o21, with: { distribution: temurin, java-version: '21.0.1+12' } }
      - { uses: actions/setup-java@v5, id: t17, with: { distribution: temurin, java-version: '17' } }
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build master, exact candidate and review variant
        shell: bash
        run: bash review/build.sh
      - name: Build MSVC std::mutex probe
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'review/native'
          cl 2>&1 | Select-Object -First 1
          cl /nologo /LD /MD /EHsc /O2 review/mutex.cpp /Fe:"$out/mutex.dll" /Fo:"$out/"
          if ($LASTEXITCODE) { throw 'cl failed' }
          dumpbin /dependents "$out/mutex.dll" | Select-String -Pattern '\.dll'
      - name: Compare runtime origins and std::mutex probe
        shell: pwsh
        env:
          REVIEW_SKIP_MISSING: '1'
          REVIEW_JDKS: >-
            {"temurin8u392":"${{ steps.o8.outputs.path }}","temurin11.0.21":"${{ steps.o11.outputs.path }}",
             "temurin17.0.9":"${{ steps.o17.outputs.path }}","temurin21.0.1":"${{ steps.o21.outputs.path }}"}
        run: |
          $env:R_HOME_DIR = (Rscript --vanilla -e 'cat(R.home())')
          $env:REVIEW_JDKS = $env:REVIEW_JDKS -replace '\\', '/'
          ./review/run.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-msvc-${{ matrix.r }}
          path: |
            ${{ runner.temp }}/review/logs
            ${{ runner.temp }}/review/results.csv
