name: Deferred JVM integration
on:
  push:
    branches: [feature/dynamic-cross-platform]
  workflow_dispatch:
jobs:
  dynamic:
    # Three runtime pairs per platform instead of every OS x vendor x version:
    # legacy layouts (JDK 8/11), current LTS (17/21, with downstream packages),
    # and other vendors spanning 11 to 25. The build JDK is always Temurin 17.
    # Linux arm64 runs all three: JDK 8 there uses jre/lib/aarch64/server.
    name: ${{ matrix.os }} ${{ matrix.set }} (${{ matrix.a-dist }} ${{ matrix.a-version }}, ${{ matrix.b-dist }} ${{ matrix.b-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        set: [legacy, current, vendor]
        include:
          - { set: legacy, a-dist: temurin, a-version: '8', b-dist: temurin, b-version: '11' }
          # Temurin has no JDK 8 for macOS on arm64.
          - { set: legacy, os: macos-latest, a-dist: zulu }
          - { set: current, a-dist: temurin, a-version: '17', b-dist: temurin, b-version: '21', downstream: true }
          - { set: vendor, a-dist: corretto, a-version: '11', b-dist: zulu, b-version: '25' }
          - { set: r45, os: windows-latest, r: '4.5', a-dist: temurin, a-version: '17', b-dist: temurin, b-version: '21' }
          # The oldest R that DESCRIPTION accepts.
          - { set: r36, os: ubuntu-24.04, r: '3.6', a-dist: temurin, a-version: '17', b-dist: temurin, b-version: '21' }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      NOAWT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r || 'release' }}
          rtools-version: '45'
      - uses: actions/setup-java@v5
        id: java-a
        with:
          distribution: ${{ matrix.a-dist }}
          java-version: ${{ matrix.a-version }}
      - uses: actions/setup-java@v5
        id: java-b
        with:
          distribution: ${{ matrix.b-dist }}
          java-version: ${{ matrix.b-version }}
      - uses: actions/setup-java@v5
        id: java-build
        with:
          distribution: temurin
          java-version: '17'
      - name: Record runtimes
        shell: bash
        env:
          JAVA_A: ${{ steps.java-a.outputs.path }}
          JAVA_B: ${{ steps.java-b.outputs.path }}
        run: |
          set -euo pipefail
          for home in "$JAVA_A" "$JAVA_B"; do
            echo "== $home"; "$home/bin/java" -version 2>&1
            # The trailing slash follows a home that is a symbolic link (Linux).
            find "$home/" \( -name 'libjvm.*' -o -name jvm.dll \) -print
            # djni recognizes a JVM library under any name by these exports.
            lib="$(find "$home/" \( -name 'libjvm.*' -o -name jvm.dll \) -path '*server*' -print -quit)"
            case "$RUNNER_OS" in
              Linux) syms="$(nm -D --defined-only "$lib")" ;;
              macOS) syms="$(nm -gU "$lib")" ;;
              Windows) syms="$(objdump -p "$lib" | tr -d '\r')" ;;
            esac
            for sym in JNI_CreateJavaVM JNI_GetCreatedJavaVMs JVM_CurrentTimeMillis; do
              if grep -Eq "[ _]$sym(@|\$| )" <<< "$syms"; then echo "exports $sym"; else echo "::error::$lib does not export $sym"; exit 1; fi
            done
          done
          {
            echo "RJE_JAVA_HOME_A=$JAVA_A"
            echo "RJE_JAVA_HOME_B=$JAVA_B"
            echo "RJE_FALLBACK_HOME=$JAVA_B"
          } >> "$GITHUB_ENV"
      - name: Prepare Windows discovery and path fixtures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Generate 8.3 names for directories created from now on.
          fsutil 8dot3name set C: 0
          # Machine-wide JavaSoft keys would take precedence over this user key.
          reg query 'HKLM\Software\JavaSoft' /s 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Output 'HKLM JavaSoft keys are present' } else { Write-Output 'No HKLM JavaSoft keys' }
          reg add 'HKCU\Software\JavaSoft\JDK' /v CurrentVersion /d rjava-test /f
          reg add 'HKCU\Software\JavaSoft\JDK\rjava-test' /v JavaHome /d "$env:RJE_JAVA_HOME_B" /f
      - name: Configure build Java
        if: runner.os != 'Windows'
        shell: bash
        run: |
          echo "export PATH=$PATH" > reconf.sh
          echo "export JAVA_HOME=$JAVA_HOME" >> reconf.sh
          echo "R CMD javareconf" >> reconf.sh
          sudo bash reconf.sh
      - name: Generate distribution and install in isolated library
        shell: bash
        run: |
          set -euo pipefail
          sh mkdist
          mkdir -p "$RUNNER_TEMP/rjava-lib"
          archive="$(ls ../rJava_*.tar.gz)"
          R CMD INSTALL --library="$RUNNER_TEMP/rjava-lib" "$archive"
          cp "$archive" "$RUNNER_TEMP/"
          echo "R_LIBS=$RUNNER_TEMP/rjava-lib" >> "$GITHUB_ENV"
      - name: Inspect native JVM linkage
        shell: bash
        run: |
          set -euo pipefail
          lib="$(Rscript --vanilla -e 'cat(system.file("libs", package="rJava"))')"
          if [[ "$RUNNER_OS" == Windows ]]; then
            objdump -p "$lib/x64/rJava.dll" > "$RUNNER_TEMP/linkage.txt"
          elif [[ "$RUNNER_OS" == macOS ]]; then
            otool -L "$lib/rJava.so" > "$RUNNER_TEMP/linkage.txt"
          else
            ldd "$lib/rJava.so" > "$RUNNER_TEMP/linkage.txt"
          fi
          cat "$RUNNER_TEMP/linkage.txt"
          if grep -Ei '(libjvm|DLL Name: jvm.dll)' "$RUNNER_TEMP/linkage.txt"; then exit 1; fi
      - name: Compare src/jni.h with the JDK headers
        shell: bash
        run: Rscript --vanilla tests-integration/jni-abi.R "$RJE_JAVA_HOME_A" "$RJE_JAVA_HOME_B"
      - name: Build a native helper that creates a JVM outside rJava
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jvmhost"
          cp tests-integration/jvmhost.c "$RUNNER_TEMP/jvmhost/"
          src="$PWD/src"
          if [[ "$RUNNER_OS" == Windows ]]; then src="$(cygpath -m "$src")"; fi
          (cd "$RUNNER_TEMP/jvmhost" && PKG_CPPFLAGS="-I$src" R CMD SHLIB jvmhost.c)
          echo "RJE_JVMHOST=$(ls "$RUNNER_TEMP"/jvmhost/jvmhost.{so,dll} 2>/dev/null)" >> "$GITHUB_ENV"
      - name: Check deferred loading in fresh processes
        shell: bash
        run: |
          set -euo pipefail
          run() { echo "::group::$*"; Rscript --vanilla tests-integration/deferred.R "$@"; echo "::endgroup::"; }
          for scenario in select retry badinput unload preloaded nonascii fallback laterload hosted; do
            run "$scenario"
          done
          run hosted explicit
          run jengine
          run preloaded global
          run laterload b
          run alias link
          run alias spelling
          if [[ "$RUNNER_OS" == Windows ]]; then run alias short; fi
          # JVM libraries mapped under names no JVM uses, and a non-JVM library with JNI exports.
          run renamed copy
          run renamed hardlink
          # A renamed jvm.dll cannot start a VM: JDK DLLs import jvm.dll by name.
          if [[ "$RUNNER_OS" != Windows ]]; then run renamed symlink; run hosted renamed; fi
          run decoy
          # The file of a mapped JVM library is deleted, or replaced by B's.
          run replaced deleted
          run replaced replaced
          run hosted replaced
      - name: Remove hard links left in the JDK directories
        if: always() && env.RJE_JAVA_HOME_A != ''
        shell: bash
        run: |
          # A mapped DLL cannot be deleted, so Windows leaves them behind until here.
          find "$RJE_JAVA_HOME_A/" "$RJE_JAVA_HOME_B/" -name 'rjava-alias-*' -print -delete
      - name: Embed R in a Java host through JRI
        shell: bash
        timeout-minutes: 5
        run: |
          Rscript --vanilla tests-integration/jri.R
          env RJE_JAVA_HOME_A="$RJE_JAVA_HOME_B" RJE_JAVA_HOME_B="$RJE_JAVA_HOME_A" Rscript --vanilla tests-integration/jri.R
      - name: Check Windows DLL search state after loads
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/dll-search"
          server="$(dirname "$(Rscript --vanilla -e 'cat(rJava:::.find.jvm.library(Sys.getenv("RJE_JAVA_HOME_A"))[1])')")"
          mkdir -p "$work/missing/bin/server" "$work/copy/bin/server"
          cp "$server/jvm.dll" "$work/copy/bin/server/"
          cp "$(dirname "$server")"/*.dll "$work/copy/bin/"
          marker="$(dirname "$server")/java.dll"
          cp "$marker" "$work/missing/bin/rjava_marker.dll"
          cp "$marker" "$work/copy/bin/rjava_marker.dll"
          gcc -Isrc -o "$work/dll-search.exe" tests-integration/dll-search.c
          w() { cygpath -w "$1"; }
          PATH="/c/Windows/System32:/c/Windows" "$work/dll-search.exe" \
            "$(w "$work/missing/bin/server/jvm.dll")" "$(w "$work/copy/bin/server/jvm.dll")" "$(w "$work/missing/bin")"
      - name: Verify bundled runtimes with installed system DLLs
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests-integration/windows-msvc.ps1 -Mode normal
      - name: Verify startup and host attachment without system VC++ DLLs
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests-integration/windows-msvc.ps1 -Mode missing
      - name: Verify startup and host attachment with VC++ 2015 in System32
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests-integration/windows-msvc.ps1 -Mode old
      - name: Check Windows JRI failure and opt-out behavior
        if: runner.os == 'Windows' && matrix.set == 'current'
        shell: bash
        run: bash tests-integration/jri-optional.sh
      - uses: actions/checkout@v4
        if: matrix.downstream
        with:
          repository: e-kotov/rJavaEnv
          ref: 693b87c67f8c521388c3fd8627c8afbc29d8766a
          path: downstream-source
      - uses: r-lib/actions/setup-r-dependencies@v2
        if: matrix.downstream
        with:
          working-directory: downstream-source
          dependencies: '"hard"'
          extra-packages: any::callr
          install-quarto: false
      - name: Test installed rJavaEnv and downstream packages with dynamic rJava
        if: matrix.downstream
        working-directory: downstream-source
        shell: Rscript {0}
        run: source("tools/test-downstream.R")
      - name: Install xlsx test dependencies in a separate library
        if: matrix.downstream
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xlsx-lib" "$RUNNER_TEMP/xlsx-src"
          # rJava is already on R_LIBS, so it is not installed as a dependency.
          Rscript -e 'lib <- file.path(Sys.getenv("RUNNER_TEMP"), "xlsx-lib")
            install.packages(c("xlsxjars", "testthat", "rprojroot", "tibble", "knitr"), lib = lib)
            stopifnot(!dir.exists(file.path(lib, "rJava")))
            src <- download.packages("xlsx", file.path(Sys.getenv("RUNNER_TEMP"), "xlsx-src"), type = "source")[, 2]
            install.packages(src, lib = lib, repos = NULL, type = "source")
            stopifnot(dir.exists(file.path(lib, "xlsx")))'
          {
            echo "RJE_RJAVA_LIB=$R_LIBS"
            echo "R_LIBS=$R_LIBS${{ runner.os == 'Windows' && ';' || ':' }}$RUNNER_TEMP/xlsx-lib"
          } >> "$GITHUB_ENV"
      - name: Start Java from a CRAN package's .onLoad (xlsx)
        if: matrix.downstream
        shell: bash
        run: Rscript --vanilla tests-integration/xlsx.R
      - name: Check the CRAN xlsx package and its tests with dynamic rJava
        if: matrix.downstream
        shell: bash
        env:
          _R_CHECK_FORCE_SUGGESTS_: 'false'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/xlsx-src"
          # JDK B is not the build JDK on PATH. NOAWT makes rJava set AWT headless.
          JAVA_HOME="$RJE_JAVA_HOME_B" R CMD check --no-manual --ignore-vignettes xlsx_*.tar.gz
          cat xlsx.Rcheck/tests/testthat.Rout* | tail -n 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dynamic-${{ matrix.os }}-${{ matrix.set }}
          path: |
            ${{ runner.temp }}/rJava_*.tar.gz
            ${{ runner.temp }}/linkage.txt
  musl:
    # musl libc with Alpine's R and OpenJDK packages. Docker runs the same
    # script on x86_64 and arm64 hosts; the container root is overlayfs on the
    # runner's kernel, as in a typical Docker deployment.
    name: alpine ${{ matrix.arch }} ${{ matrix.set }} (openjdk ${{ matrix.a }}, openjdk ${{ matrix.b }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04, set: legacy, a: '8', b: '11' }
          - { arch: x86_64, runner: ubuntu-24.04, set: current, a: '17', b: '21' }
          - { arch: aarch64, runner: ubuntu-24.04-arm, set: current, a: '17', b: '21' }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check deferred loading, JRI and host attachment on musl
        env:
          # alpine:3.24.2
          IMAGE: alpine@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
        run: |
          docker run --rm -v "$PWD:/src:ro" "$IMAGE" \
            sh -c 'apk add --no-cache bash && exec bash /src/tests-integration/musl.sh "$1" "$2" "$3"' \
            sh '${{ matrix.a }}' '${{ matrix.b }}' '${{ matrix.arch }}'
