name: Mapped JVM filesystem identity
on:
  push:
    branches: [feature/dynamic-cross-platform]
  workflow_dispatch:
permissions:
  contents: read
env:
  UPSTREAM_CANDIDATE: fdbe195dc8e9a480345197eede0d0131a912eac5
jobs:
  filesystem:
    name: Mapped JVM (${{ matrix.fs }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        fs: [btrfs, ext4]
    env:
      NOAWT: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Verify the upstream candidate runtime sources
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$UPSTREAM_CANDIDATE"
          git diff --exit-code "$UPSTREAM_CANDIDATE" HEAD -- NEWS R src man configure configure.ac configure.win
          echo "Runtime sources match upstream candidate $UPSTREAM_CANDIDATE"
      - uses: r-lib/actions/setup-r@v2
      - uses: actions/setup-java@v5
        id: java-b
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@v5
        id: java-a
        with:
          distribution: temurin
          java-version: '17'
      - name: Install filesystem and JRI build dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends btrfs-progs e2fsprogs libtirpc-dev libicu-dev
      - name: Build and install the candidate
        shell: bash
        run: |
          set -euo pipefail
          sudo env "JAVA_HOME=$JAVA_HOME" "PATH=$PATH" R CMD javareconf
          sh mkdist
          mkdir -p "$RUNNER_TEMP/rjava-lib" "$RUNNER_TEMP/jvmhost"
          R CMD INSTALL --library="$RUNNER_TEMP/rjava-lib" ../rJava_*.tar.gz
          cp tests-integration/jvmhost.c "$RUNNER_TEMP/jvmhost/"
          (cd "$RUNNER_TEMP/jvmhost" && PKG_CPPFLAGS="-I$GITHUB_WORKSPACE/src" R CMD SHLIB jvmhost.c)
          {
            echo "R_LIBS=$RUNNER_TEMP/rjava-lib"
            echo "RJE_JVMHOST=$RUNNER_TEMP/jvmhost/jvmhost.so"
          } >> "$GITHUB_ENV"
      - name: Reproduce the old bug and exercise the candidate on a real filesystem
        env:
          RJE_JAVA_HOME_A: ${{ steps.java-a.outputs.path }}
          RJE_JAVA_HOME_B: ${{ steps.java-b.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          bash tests-integration/filesystems.sh '${{ matrix.fs }}' 2>&1 | tee "$RUNNER_TEMP/filesystem-${{ matrix.fs }}.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: filesystem-${{ matrix.fs }}
          path: ${{ runner.temp }}/filesystem-${{ matrix.fs }}.log
